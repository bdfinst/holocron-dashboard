# load our custom modules
load_module modules/ndk_http_module.so;
load_module modules/ngx_http_set_misc_module.so;

worker_processes        1;
worker_rlimit_nofile    8192;
error_log               /var/log/nginx/error.log;
pid                     /var/cache/nginx/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include         /etc/nginx/mime.types;
    default_type    application/octet-stream;

    keepalive_timeout   65;

    gzip            on;
    gzip_min_length 256;
    gzip_types
        text/css
        text/javascript
        text/xml
        text/plain
        text/x-component
        application/javascript
        application/json
        application/xml
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;

    server {
        listen  8080;
        root    /var/www;
        #######
        # csp nonce setup

        # generate the cryptographically secure random string which is 32
        # characters in length and stored in a variable called $cspNonce
        set_secure_random_alphanum $cspNonce 32;

        # substitute our nonce  placeholder with the dynamically created nonce
        sub_filter_once off;
        sub_filter_types *;
        sub_filter HOLOCRON_NONCE $cspNonce;
        location / {
            try_files   $uri    $uri/   /index.html =404;


            add_header  Content-Security-Policy     "
                                                    default-src 'self';
                                                    script-src 'self' 'nonce-$cspNonce';
                                                    connect-src 'self';
                                                    form-action 'self';
                                                    frame-src 'none';
                                                    frame-ancestors 'none';
                                                    manifest-src 'self' *.dso.mil;
                                                    style-src 'self' 'nonce-$cspNonce';
                                                    font-src 'self';
                                                    object-src 'none';
                                                    media-src 'none';
                                                    img-src 'self';
                                                    ";
            add_header  X-Frame-Options             DENY;
            add_header  X-Content-Type-Options      nosniff;
            add_header  X-XSS-Protection            "1; mode=block";
            add_header  Strict-Transport-Security   "max-age=31536000; includeSubdomains;";
            add_header  Cache-Control               "no-store, no-cache, max-age=0, must-revalidate";
            expires -1;
        }
    }
}
